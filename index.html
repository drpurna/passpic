<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Passport Photo Studio – Edit, Layout & PDF</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --primary: #0f766e;
            --primary-light: #14b8a6;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --radius: 20px;
            --shadow: 0 8px 30px rgba(0,0,0,0.05);
            --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .app {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }
        .header {
            text-align: center;
            padding: 12px 0 8px;
        }
        .header .logo { font-size: 2rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; }
        .header p { font-size: 0.85rem; color: var(--text-light); }
        .stepper {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        .step-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--border); transition: 0.2s;
        }
        .step-dot.active { background: var(--primary); }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 14px;
            padding: 30px 16px;
            text-align: center;
            cursor: pointer;
            background: #f8fafc;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: #f0fdfa;
        }
        .upload-area .icon { font-size: 2.5rem; }
        .upload-area p { font-size: 0.9rem; color: var(--text-light); margin-top: 8px; }
        .preview-container {
            position: relative;
            background: #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 35/45;
            width: 100%;
            touch-action: none;
        }
        canvas#editCanvas {
            position: absolute; top:0; left:0;
            width:100%; height:100%; object-fit: contain;
        }
        .crop-box {
            position: absolute;
            border: 2px solid white;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
            pointer-events: auto; cursor: grab;
            border-radius: 4px;
        }
        .crop-box:active { cursor: grabbing; }
        .tools {
            display: flex; flex-direction: column; gap: 12px;
        }
        .slider-group { display: flex; flex-direction: column; gap: 4px; }
        .slider-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-light); display: flex; justify-content: space-between; }
        input[type=range] { width:100%; }
        .row-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            padding: 10px 16px; border: none; border-radius: 10px;
            font-weight: 600; font-size: 0.9rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: var(--primary); color: white; transition: 0.2s;
            white-space: nowrap; flex: 1; min-width: 80px;
        }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--text); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        select, input[type=color] {
            padding: 10px; border-radius: 10px; border: 1px solid var(--border);
            font-size: 0.9rem; background: white; width: 100%;
        }
        .layout-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(100px,1fr)); gap: 8px;
        }
        .layout-option {
            border: 2px solid var(--border); border-radius: 12px; padding: 8px; text-align: center;
            cursor: pointer; font-size: 0.75rem; font-weight: 600;
        }
        .layout-option.selected { border-color: var(--primary); background: #f0fdfa; }
        .hidden { display: none !important; }
        @media (max-width:380px) {
            .btn { padding: 10px 12px; font-size:0.8rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <span class="logo">🛂</span>
        <h1>Passport Photo Studio</h1>
        <p>AI remove · edit · layout · PDF</p>
    </div>
    <div class="stepper" id="stepper">
        <span class="step-dot active" data-step="1"></span>
        <span class="step-dot" data-step="2"></span>
        <span class="step-dot" data-step="3"></span>
    </div>

    <!-- STEP 1: Upload -->
    <div class="card" id="step1">
        <div class="upload-area" id="uploadBox">
            <div class="icon">📷</div>
            <p><strong>Tap to upload passport photo</strong></p>
            <p style="font-size:0.75rem;">AI removes background instantly</p>
            <input type="file" accept="image/*" id="fileInput" hidden>
        </div>
        <div id="statusUpload" style="text-align:center; font-size:0.85rem; color:var(--text-light)"></div>
    </div>

    <!-- STEP 2: Edit & Crop -->
    <div class="card hidden" id="step2">
        <div class="preview-container" id="cropWrapper">
            <canvas id="editCanvas"></canvas>
            <div class="crop-box" id="cropBox"></div>
        </div>
        <div class="tools">
            <div class="slider-group">
                <label>Brightness <span id="brightVal">100%</span></label>
                <input type="range" id="brightness" min="50" max="150" value="100" step="1">
            </div>
            <div class="slider-group">
                <label>Contrast <span id="contrastVal">100%</span></label>
                <input type="range" id="contrast" min="50" max="150" value="100" step="1">
            </div>
            <div class="slider-group">
                <label>Saturation <span id="satVal">100%</span></label>
                <input type="range" id="saturation" min="0" max="200" value="100" step="1">
            </div>
            <div class="slider-group">
                <label>Feather edge <span id="featherVal">0px</span></label>
                <input type="range" id="feather" min="0" max="25" value="0" step="1">
            </div>
            <div class="row-buttons">
                <button class="btn btn-outline" id="rotateLeft">↺ Left</button>
                <button class="btn btn-outline" id="rotateRight">↻ Right</button>
                <button class="btn btn-outline" id="flipH">⇔ Flip H</button>
                <button class="btn btn-outline" id="flipV">⇕ Flip V</button>
            </div>
            <label>Background color</label>
            <input type="color" id="bgColor" value="#ffffff">
            <select id="sizeSelect">
                <option value="35x45">🇮🇳 India / EU 35×45 mm</option>
                <option value="51x51">🇺🇸 US / India 51×51 mm</option>
                <option value="35x35">🇪🇺 Schengen 35×35 mm</option>
                <option value="50x50">🇨🇳 China 50×50 mm</option>
            </select>
            <button class="btn" id="nextToLayout">📐 Choose Layout →</button>
        </div>
        <div id="statusEdit" style="text-align:center; font-size:0.85rem; color:var(--text-light)"></div>
    </div>

    <!-- STEP 3: Layout & Export -->
    <div class="card hidden" id="step3">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
            <canvas id="singlePreview" width="150" height="200" style="border-radius:8px; border:1px solid var(--border)"></canvas>
            <div>
                <strong>Final photo</strong><br>
                <span id="sizeLabel">35×45 mm · 300 DPI</span>
            </div>
        </div>
        <label>Print layout (4×6 inch sheet)</label>
        <div class="layout-grid" id="layoutOptions">
            <div class="layout-option selected" data-layout="single">Single</div>
            <div class="layout-option" data-layout="2">2 copies</div>
            <div class="layout-option" data-layout="4">4 copies</div>
            <div class="layout-option" data-layout="6">6 copies</div>
            <div class="layout-option" data-layout="8">8 copies</div>
        </div>
        <canvas id="layoutCanvas" style="width:100%; border:1px solid var(--border); border-radius:8px;"></canvas>
        <div class="row-buttons">
            <button class="btn" id="downloadJpegSingle">📥 JPEG Single</button>
            <button class="btn btn-outline" id="downloadJpegSheet">🖼️ JPEG Sheet</button>
            <button class="btn btn-outline" id="downloadPdf">📄 PDF Sheet</button>
        </div>
        <button class="btn btn-outline" id="newPhoto">🔄 Start New</button>
    </div>
</div>

<!-- PDF library (loads normally) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- ========== AI LIBRARY (ESM, fully resolved via esm.sh) ========== -->
<script type="module">
    // ---- AI background removal library ----
    let removeBackgroundFn = null;
    let libLoadError = null;
    try {
        const mod = await import('https://esm.sh/@imgly/background-removal@1.6.0');
        // The main function may be in `mod.removeBackground` or `mod.default.removeBackground`
        removeBackgroundFn = mod.removeBackground || (mod.default && mod.default.removeBackground);
        if (!removeBackgroundFn) {
            throw new Error('Could not find removeBackground function in the imported module.');
        }
    } catch (err) {
        libLoadError = err;
        console.error('Failed to load background removal library:', err);
    }

    // ---- DOM elements ----
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const dots = document.querySelectorAll('.step-dot');
    const uploadBox = document.getElementById('uploadBox');
    const fileInput = document.getElementById('fileInput');
    const statusUpload = document.getElementById('statusUpload');
    const statusEdit = document.getElementById('statusEdit');
    const canvasEdit = document.getElementById('editCanvas');
    const ctxEdit = canvasEdit.getContext('2d');
    const cropBox = document.getElementById('cropBox');
    const cropWrapper = document.getElementById('cropWrapper');
    const sizeSelect = document.getElementById('sizeSelect');
    const bgColorInput = document.getElementById('bgColor');
    const brightnessInput = document.getElementById('brightness');
    const contrastInput = document.getElementById('contrast');
    const saturationInput = document.getElementById('saturation');
    const featherInput = document.getElementById('feather');
    const rotateLeft = document.getElementById('rotateLeft');
    const rotateRight = document.getElementById('rotateRight');
    const flipH = document.getElementById('flipH');
    const flipV = document.getElementById('flipV');
    const nextToLayout = document.getElementById('nextToLayout');
    const singlePreview = document.getElementById('singlePreview');
    const layoutCanvas = document.getElementById('layoutCanvas');
    const layoutOptions = document.querySelectorAll('.layout-option');
    const downloadJpegSingle = document.getElementById('downloadJpegSingle');
    const downloadJpegSheet = document.getElementById('downloadJpegSheet');
    const downloadPdf = document.getElementById('downloadPdf');
    const newPhotoBtn = document.getElementById('newPhoto');
    const sizeLabel = document.getElementById('sizeLabel');

    if (libLoadError) {
        statusUpload.textContent = '❌ Could not load the AI background removal library. Check your connection and reload the page.';
    }

    // ---- State ----
    let rawImage = null;
    let editedImage = null;
    let editRotation = 0;
    let editFlipH = false, editFlipV = false;
    let cropX = 0.2, cropY = 0.2, cropW = 0.6;
    let currentLayout = 'single';
    let finalPhotoDataUrl = null;

    function setStep(n) {
        step1.classList.toggle('hidden', n !== 1);
        step2.classList.toggle('hidden', n !== 2);
        step3.classList.toggle('hidden', n !== 3);
        dots.forEach((d, i) => d.classList.toggle('active', i+1 === n));
    }

    function getAspectRatio() {
        const [w, h] = sizeSelect.value.split('x').map(Number);
        return w / h;
    }

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

    function boxBlurAlpha(alpha, w, h, radius) {
        const result = new Uint8Array(alpha.length);
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let sum = 0, count = 0;
                for (let dy = -radius; dy <= radius; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        const nx = x + dx, ny = y + dy;
                        if (nx >=0 && nx < w && ny >=0 && ny < h) {
                            sum += alpha[ny * w + nx];
                            count++;
                        }
                    }
                }
                result[y * w + x] = sum / count;
            }
        }
        return result;
    }

    function applyEdits() {
        if (!rawImage) return;
        const w = rawImage.width, h = rawImage.height;
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = w; tempCanvas.height = h;
        const tctx = tempCanvas.getContext('2d');

        tctx.clearRect(0,0,w,h);
        tctx.drawImage(rawImage, 0, 0);

        const imageData = tctx.getImageData(0, 0, w, h);
        const data = imageData.data;

        const featherRadius = parseInt(featherInput.value, 10);
        if (featherRadius > 0) {
            const alphaCopy = new Uint8Array(data.length / 4);
            for (let i = 0; i < alphaCopy.length; i++) alphaCopy[i] = data[i*4 + 3];
            const blurred = boxBlurAlpha(alphaCopy, w, h, featherRadius);
            for (let i = 0; i < alphaCopy.length; i++) data[i*4 + 3] = blurred[i];
        }

        tctx.putImageData(imageData, 0, 0);

        const b = brightnessInput.value / 100;
        const c = contrastInput.value / 100;
        const s = saturationInput.value / 100;
        tctx.filter = `brightness(${b}) contrast(${c}) saturate(${s})`;
        tctx.drawImage(tempCanvas, 0, 0);
        tctx.filter = 'none';

        let transW = w, transH = h;
        if (editRotation === 90 || editRotation === 270) [transW, transH] = [h, w];
        const rotCanvas = document.createElement('canvas');
        rotCanvas.width = transW; rotCanvas.height = transH;
        const rctx = rotCanvas.getContext('2d');
        rctx.save();
        rctx.translate(transW/2, transH/2);
        if (editFlipH) rctx.scale(-1, 1);
        if (editFlipV) rctx.scale(1, -1);
        rctx.rotate(editRotation * Math.PI / 180);
        rctx.drawImage(tempCanvas, -w/2, -h/2);
        rctx.restore();

        editedImage = new Image();
        editedImage.src = rotCanvas.toDataURL();
        return new Promise(resolve => { editedImage.onload = resolve; });
    }

    async function drawEditPreview() {
        if (!editedImage) return;
        const wrapperW = cropWrapper.clientWidth;
        const wrapperH = cropWrapper.clientHeight;
        canvasEdit.width = wrapperW;
        canvasEdit.height = wrapperH;

        const imgW = editedImage.width, imgH = editedImage.height;
        const scale = Math.min(wrapperW / imgW, wrapperH / imgH);
        const drawW = imgW * scale, drawH = imgH * scale;
        const offsetX = (wrapperW - drawW) / 2, offsetY = (wrapperH - drawH) / 2;

        ctxEdit.clearRect(0,0,wrapperW,wrapperH);
        ctxEdit.fillStyle = bgColorInput.value;
        ctxEdit.fillRect(0,0,wrapperW,wrapperH);
        ctxEdit.drawImage(editedImage, offsetX, offsetY, drawW, drawH);
        updateCropBox();
    }

    function updateCropBox() {
        const wrapperW = cropWrapper.clientWidth;
        const wrapperH = cropWrapper.clientHeight;
        const aspect = getAspectRatio();
        let boxW = cropW * wrapperW;
        let boxH = boxW / aspect;
        if (boxH > wrapperH) {
            boxH = wrapperH * 0.9;
            boxW = boxH * aspect;
            cropW = boxW / wrapperW;
        }
        cropBox.style.left = (cropX * wrapperW) + 'px';
        cropBox.style.top = (cropY * wrapperH) + 'px';
        cropBox.style.width = boxW + 'px';
        cropBox.style.height = boxH + 'px';
    }

    function resetCrop() {
        const aspect = getAspectRatio();
        const wrapperH = cropWrapper.clientHeight;
        const wrapperW = cropWrapper.clientWidth;
        let initH = 0.6;
        let initW = initH * aspect * (wrapperH / wrapperW);
        if (initW > 0.85) { initW = 0.85; initH = initW / aspect * (wrapperW / wrapperH); }
        if (initW < 0.25) { initW = 0.25; initH = initW / aspect * (wrapperW / wrapperH); }
        cropW = initW;
        cropX = (1 - initW) / 2;
        cropY = (1 - initH) / 2;
        updateCropBox();
    }

    function generateFinalPhoto() {
        if (!editedImage) return null;
        const [wMM, hMM] = sizeSelect.value.split('x').map(Number);
        const dpi = 300;
        const finalW = Math.round(wMM * dpi / 25.4);
        const finalH = Math.round(hMM * dpi / 25.4);

        const wrapperW = cropWrapper.clientWidth;
        const wrapperH = cropWrapper.clientHeight;
        const boxLeft = parseFloat(cropBox.style.left);
        const boxTop = parseFloat(cropBox.style.top);
        const boxW = parseFloat(cropBox.style.width);
        const boxH = parseFloat(cropBox.style.height);

        const imgW = editedImage.width, imgH = editedImage.height;
        const scale = Math.min(wrapperW / imgW, wrapperH / imgH);
        const drawW = imgW * scale, drawH = imgH * scale;
        const offsetX = (wrapperW - drawW) / 2, offsetY = (wrapperH - drawH) / 2;

        const srcX = (boxLeft - offsetX) / scale;
        const srcY = (boxTop - offsetY) / scale;
        const srcW = boxW / scale, srcH = boxH / scale;

        const outCanvas = document.createElement('canvas');
        outCanvas.width = finalW; outCanvas.height = finalH;
        const outCtx = outCanvas.getContext('2d');
        outCtx.fillStyle = bgColorInput.value;
        outCtx.fillRect(0, 0, finalW, finalH);
        outCtx.drawImage(editedImage, srcX, srcY, srcW, srcH, 0, 0, finalW, finalH);
        return outCanvas;
    }

    function drawSinglePreview() {
        const finalCanvas = generateFinalPhoto();
        if (!finalCanvas) return;
        const previewCtx = singlePreview.getContext('2d');
        previewCtx.clearRect(0,0,150,200);
        previewCtx.drawImage(finalCanvas, 0,0,150,200);
        finalPhotoDataUrl = finalCanvas.toDataURL('image/jpeg', 0.92);
    }

    function drawLayoutPreview() {
        const finalCanvas = generateFinalPhoto();
        if (!finalCanvas) return;
        const dpi = 300;
        const sheetW = 4 * dpi;
        const sheetH = 6 * dpi;
        const photoW = finalCanvas.width, photoH = finalCanvas.height;
        const margin = 10;

        let cols, rows;
        if (currentLayout === 'single') { cols = 1; rows = 1; }
        else if (currentLayout === '2') { cols = 1; rows = 2; }
        else if (currentLayout === '4') { cols = 2; rows = 2; }
        else if (currentLayout === '6') { cols = 2; rows = 3; }
        else if (currentLayout === '8') { cols = 2; rows = 4; }
        else { cols = 1; rows = 1; }

        const layoutCanvasEl = document.getElementById('layoutCanvas');
        layoutCanvasEl.width = sheetW;
        layoutCanvasEl.height = sheetH;
        const lctx = layoutCanvasEl.getContext('2d');
        lctx.fillStyle = '#ffffff';
        lctx.fillRect(0,0,sheetW,sheetH);

        const totalW = cols * photoW + (cols-1) * margin;
        const totalH = rows * photoH + (rows-1) * margin;
        const startX = (sheetW - totalW) / 2;
        const startY = (sheetH - totalH) / 2;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x = startX + c * (photoW + margin);
                const y = startY + r * (photoH + margin);
                lctx.drawImage(finalCanvas, x, y, photoW, photoH);
            }
        }
    }

    function updateLayout() {
        drawSinglePreview();
        drawLayoutPreview();
    }

    function downloadURI(dataUri, filename) {
        const link = document.createElement('a');
        link.href = dataUri;
        link.download = filename;
        link.click();
    }

    function exportJpegSingle() {
        if (finalPhotoDataUrl) downloadURI(finalPhotoDataUrl, 'passport_single.jpg');
    }

    function exportJpegSheet() {
        const sheetCanvas = document.getElementById('layoutCanvas');
        const dataUrl = sheetCanvas.toDataURL('image/jpeg', 0.92);
        downloadURI(dataUrl, 'passport_sheet.jpg');
    }

    function exportPdf() {
        const sheetCanvas = document.getElementById('layoutCanvas');
        const imgData = sheetCanvas.toDataURL('image/jpeg', 0.92);
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'in', format: [4, 6] });
        doc.addImage(imgData, 'JPEG', 0, 0, 4, 6);
        doc.save('passport_sheet.pdf');
    }

    // ---- Event listeners ----
    uploadBox.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
        if (e.target.files[0]) processUpload(e.target.files[0]);
    });
    uploadBox.addEventListener('dragover', e => { e.preventDefault(); uploadBox.classList.add('dragover'); });
    uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
    uploadBox.addEventListener('drop', e => {
        e.preventDefault();
        uploadBox.classList.remove('dragover');
        if (e.dataTransfer.files[0]) processUpload(e.dataTransfer.files[0]);
    });

    async function processUpload(file) {
        if (!removeBackgroundFn) {
            statusUpload.textContent = '❌ The AI background removal library is not available. Please reload the page.';
            return;
        }
        statusUpload.textContent = '⏳ Removing background with AI…';
        uploadBox.style.pointerEvents = 'none';
        try {
            const blob = await removeBackgroundFn(file, {
                output: { format: 'image/png', quality: 1 },
                progress: (key, current, total) => {
                    statusUpload.textContent = `AI: ${Math.round(current/total*100)}%`;
                }
            });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = async () => {
                rawImage = img;
                URL.revokeObjectURL(url);
                statusUpload.textContent = '';
                uploadBox.style.pointerEvents = 'auto';
                brightnessInput.value = 100; contrastInput.value = 100;
                saturationInput.value = 100; featherInput.value = 0;
                bgColorInput.value = '#ffffff';
                editRotation = 0; editFlipH = false; editFlipV = false;
                document.getElementById('brightVal').textContent = '100%';
                document.getElementById('contrastVal').textContent = '100%';
                document.getElementById('satVal').textContent = '100%';
                document.getElementById('featherVal').textContent = '0px';
                await applyEdits();
                resetCrop();
                setStep(2);
                await drawEditPreview();
                statusEdit.textContent = 'Drag the rectangle to frame your face.';
            };
            img.src = url;
        } catch (err) {
            statusUpload.textContent = '❌ Error: ' + err.message;
            uploadBox.style.pointerEvents = 'auto';
        }
    }

    [brightnessInput, contrastInput, saturationInput, featherInput].forEach(slider => {
        slider.addEventListener('input', async () => {
            document.getElementById('brightVal').textContent = brightnessInput.value + '%';
            document.getElementById('contrastVal').textContent = contrastInput.value + '%';
            document.getElementById('satVal').textContent = saturationInput.value + '%';
            document.getElementById('featherVal').textContent = featherInput.value + 'px';
            await applyEdits();
            await drawEditPreview();
        });
    });

    rotateLeft.addEventListener('click', async () => { editRotation = (editRotation - 90 + 360) % 360; await applyEdits(); await drawEditPreview(); });
    rotateRight.addEventListener('click', async () => { editRotation = (editRotation + 90) % 360; await applyEdits(); await drawEditPreview(); });
    flipH.addEventListener('click', async () => { editFlipH = !editFlipH; await applyEdits(); await drawEditPreview(); });
    flipV.addEventListener('click', async () => { editFlipV = !editFlipV; await applyEdits(); await drawEditPreview(); });
    bgColorInput.addEventListener('input', () => drawEditPreview());
    sizeSelect.addEventListener('change', async () => { resetCrop(); await drawEditPreview(); });

    nextToLayout.addEventListener('click', () => {
        sizeLabel.textContent = `${sizeSelect.value.replace('x','×')} mm · 300 DPI`;
        updateLayout();
        setStep(3);
    });

    layoutOptions.forEach(opt => {
        opt.addEventListener('click', () => {
            layoutOptions.forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            currentLayout = opt.dataset.layout;
            drawLayoutPreview();
        });
    });

    downloadJpegSingle.addEventListener('click', exportJpegSingle);
    downloadJpegSheet.addEventListener('click', exportJpegSheet);
    downloadPdf.addEventListener('click', exportPdf);
    newPhotoBtn.addEventListener('click', () => {
        rawImage = null; editedImage = null;
        setStep(1);
    });

    // Crop drag
    let dragging = false, startX, startY, startLeft, startTop;
    cropBox.addEventListener('mousedown', e => { dragging = true; startX = e.clientX; startY = e.clientY; startLeft = parseFloat(cropBox.style.left); startTop = parseFloat(cropBox.style.top); });
    cropBox.addEventListener('touchstart', e => { e.preventDefault(); dragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; startLeft = parseFloat(cropBox.style.left); startTop = parseFloat(cropBox.style.top); });
    window.addEventListener('mousemove', e => {
        if (!dragging) return;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        let wrapperW = cropWrapper.clientWidth, wrapperH = cropWrapper.clientHeight;
        let boxW = parseFloat(cropBox.style.width), boxH = parseFloat(cropBox.style.height);
        let newLeft = clamp(startLeft + dx, 0, wrapperW - boxW);
        let newTop = clamp(startTop + dy, 0, wrapperH - boxH);
        cropBox.style.left = newLeft + 'px';
        cropBox.style.top = newTop + 'px';
        cropX = newLeft / wrapperW; cropY = newTop / wrapperH;
    });
    window.addEventListener('touchmove', e => {
        if (!dragging) return;
        const dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
        let wrapperW = cropWrapper.clientWidth, wrapperH = cropWrapper.clientHeight;
        let boxW = parseFloat(cropBox.style.width), boxH = parseFloat(cropBox.style.height);
        let newLeft = clamp(startLeft + dx, 0, wrapperW - boxW);
        let newTop = clamp(startTop + dy, 0, wrapperH - boxH);
        cropBox.style.left = newLeft + 'px';
        cropBox.style.top = newTop + 'px';
        cropX = newLeft / wrapperW; cropY = newTop / wrapperH;
    });
    window.addEventListener('mouseup', () => dragging = false);
    window.addEventListener('touchend', () => dragging = false);
    window.addEventListener('resize', async () => { if (editedImage) { await drawEditPreview(); } });

    setStep(1);
</script>
</body>
</html>
