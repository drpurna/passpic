<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Passport Photo Maker – AI Background Remover</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --primary: #0f766e;
            --primary-light: #14b8a6;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --radius: 20px;
            --shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .app {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .header {
            text-align: center;
            padding: 20px 0 0;
        }
        .header .logo {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 6px;
        }
        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
        }
        .header p {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 4px;
        }
        .steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.75rem;
            color: var(--text-light);
        }
        .step {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .step.active {
            color: var(--primary);
            font-weight: 600;
        }
        .step .circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: white;
        }
        .step.active .circle {
            background: var(--primary);
        }
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 30px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #f8fafc;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: #f0fdfa;
        }
        .upload-area .upload-icon {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }
        .upload-area p {
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .preview-container {
            display: none;
            flex-direction: column;
            gap: 16px;
        }
        .crop-wrapper {
            position: relative;
            background: #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 35/45;
            width: 100%;
            touch-action: none;
        }
        canvas#canvas {
            position: absolute;
            top:0; left:0;
            width:100%; height:100%;
            object-fit: contain;
        }
        .crop-box {
            position: absolute;
            border: 2px solid white;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
            pointer-events: auto;
            cursor: grab;
            touch-action: none;
            border-radius: 4px;
        }
        .crop-box:active { cursor: grabbing; }
        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 100px;
            padding: 14px 10px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:disabled {
            background: #94a3b8;
            pointer-events: none;
        }
        .btn-outline {
            background: white;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-danger {
            background: white;
            border: 1px solid #fecaca;
            color: var(--danger);
        }
        select {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: white;
            font-size: 0.9rem;
            width: 100%;
            margin-top: 8px;
        }
        .status {
            font-size: 0.85rem;
            color: var(--text-light);
            text-align: center;
            padding: 8px;
        }
        .download-card {
            display: none;
            text-align: center;
        }
        .download-card img {
            max-width: 150px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        @media (max-width: 380px) {
            .btn { font-size: 0.85rem; padding: 12px 8px; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Header -->
    <div class="header">
        <span class="logo">🛂</span>
        <h1>Passport Photo Maker</h1>
        <p>Remove background & crop perfectly</p>
    </div>

    <!-- Step indicators -->
    <div class="steps" id="stepsBar">
        <span class="step active" data-step="1"><span class="circle">1</span> Upload</span>
        <span class="step" data-step="2"><span class="circle">2</span> Crop</span>
        <span class="step" data-step="3"><span class="circle">3</span> Download</span>
    </div>

    <!-- Step 1: Upload -->
    <div class="card" id="step1">
        <div class="upload-area" id="uploadBox">
            <div class="upload-icon">📷</div>
            <p><strong>Tap to upload</strong> a passport‑style photo</p>
            <p style="font-size:0.75rem;">AI will remove the background automatically</p>
            <input type="file" accept="image/*" id="fileInput" hidden>
        </div>
        <div class="status" id="statusMsg1">Your photo stays private – processed on device</div>
    </div>

    <!-- Step 2: Crop & Adjust -->
    <div class="card" id="step2" style="display:none;">
        <div class="preview-container" id="previewContainer">
            <div class="crop-wrapper" id="cropWrapper">
                <canvas id="canvas"></canvas>
                <div class="crop-box" id="cropBox"></div>
            </div>
            <select id="sizeSelect">
                <option value="35x45">🇮🇳 India / EU – 35×45 mm</option>
                <option value="51x51">🇺🇸 US / India – 51×51 mm</option>
                <option value="35x35">🇪🇺 Schengen – 35×35 mm</option>
                <option value="50x50">🇨🇳 China – 50×50 mm</option>
            </select>
            <div class="button-row">
                <button class="btn btn-outline" id="resetCropBtn">↺ Reset</button>
                <button class="btn btn-danger" id="redoBtn">↩ New Photo</button>
            </div>
            <button class="btn btn-primary" id="nextToDownload">✨ Create Passport Photo</button>
        </div>
        <div class="status" id="statusMsg2"></div>
    </div>

    <!-- Step 3: Download -->
    <div class="card download-card" id="step3" style="display:none;">
        <img id="resultPreview" alt="Passport result" src="" style="display:none;">
        <p style="margin-bottom:12px; font-weight:600;">✅ Your passport photo is ready</p>
        <p style="font-size:0.9rem; color:var(--text-light); margin-bottom:16px;">300 DPI, perfect for printing</p>
        <button class="btn btn-primary" id="downloadBtn">⬇ Download JPEG</button>
        <button class="btn btn-outline" id="newPhotoBtn" style="margin-top:10px;">🔄 Make Another</button>
    </div>
</div>

<!-- AI Background Removal (IS-Net) -->
<script src="https://unpkg.com/@imgly/background-removal@1.6.0/dist/background-removal.iife.js"></script>

<script>
    // ---------- DOM elements ----------
    const fileInput = document.getElementById('fileInput');
    const uploadBox = document.getElementById('uploadBox');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const stepsBar = document.getElementById('stepsBar');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cropBox = document.getElementById('cropBox');
    const cropWrapper = document.getElementById('cropWrapper');
    const sizeSelect = document.getElementById('sizeSelect');
    const resetCropBtn = document.getElementById('resetCropBtn');
    const redoBtn = document.getElementById('redoBtn');
    const nextToDownload = document.getElementById('nextToDownload');
    const downloadBtn = document.getElementById('downloadBtn');
    const newPhotoBtn = document.getElementById('newPhotoBtn');
    const resultPreview = document.getElementById('resultPreview');
    const statusMsg1 = document.getElementById('statusMsg1');
    const statusMsg2 = document.getElementById('statusMsg2');

    let originalImage = null;
    let cropX = 0.2, cropY = 0.2, cropW = 0.6;

    // ---------- Step navigation ----------
    function setStep(step) {
        step1.style.display = step === 1 ? 'block' : 'none';
        step2.style.display = step === 2 ? 'flex' : 'none';
        step3.style.display = step === 3 ? 'block' : 'none';
        document.querySelectorAll('.step').forEach((el, i) => {
            el.classList.toggle('active', i+1 === step);
        });
    }

    function getAspectRatio() {
        const [w, h] = sizeSelect.value.split('x').map(Number);
        return w / h;
    }

    // ---------- Crop box logic ----------
    function updateCropBox() {
        const wrapperW = cropWrapper.clientWidth;
        const wrapperH = cropWrapper.clientHeight;
        const aspect = getAspectRatio();
        let boxW = cropW * wrapperW;
        let boxH = boxW / aspect;
        if (boxH > wrapperH) {
            boxH = wrapperH * 0.9;
            boxW = boxH * aspect;
            cropW = boxW / wrapperW;
        }
        cropBox.style.left = (cropX * wrapperW) + 'px';
        cropBox.style.top = (cropY * wrapperH) + 'px';
        cropBox.style.width = boxW + 'px';
        cropBox.style.height = boxH + 'px';
    }

    function resetCrop() {
        const aspect = getAspectRatio();
        const wrapperH = cropWrapper.clientHeight;
        const wrapperW = cropWrapper.clientWidth;
        let initH = 0.6;
        let initW = initH * aspect * (wrapperH / wrapperW);
        if (initW > 0.85) { initW = 0.85; initH = initW / aspect * (wrapperW / wrapperH); }
        if (initW < 0.25) { initW = 0.25; initH = initW / aspect * (wrapperW / wrapperH); }
        cropW = initW;
        cropX = (1 - initW) / 2;
        cropY = (1 - initH) / 2;
        updateCropBox();
    }

    // ---------- Drag ----------
    let dragging = false, startX, startY, startLeft, startTop;
    cropBox.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
    cropBox.addEventListener('touchstart', e => {
        e.preventDefault();
        startDrag(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('mousemove', e => dragMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => {
        if (dragging) e.preventDefault();
        if (dragging) dragMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);

    function startDrag(clientX, clientY) {
        dragging = true;
        startX = clientX;
        startY = clientY;
        startLeft = parseFloat(cropBox.style.left);
        startTop = parseFloat(cropBox.style.top);
    }
    function dragMove(clientX, clientY) {
        if (!dragging) return;
        let dx = clientX - startX;
        let dy = clientY - startY;
        let wrapperW = cropWrapper.clientWidth;
        let wrapperH = cropWrapper.clientHeight;
        let boxW = parseFloat(cropBox.style.width);
        let boxH = parseFloat(cropBox.style.height);
        let newLeft = Math.max(0, Math.min(startLeft + dx, wrapperW - boxW));
        let newTop = Math.max(0, Math.min(startTop + dy, wrapperH - boxH));
        cropBox.style.left = newLeft + 'px';
        cropBox.style.top = newTop + 'px';
        cropX = newLeft / wrapperW;
        cropY = newTop / wrapperH;
    }
    function endDrag() { dragging = false; }

    // ---------- Redraw canvas ----------
    function drawCanvas() {
        if (!originalImage) return;
        const wrapperW = cropWrapper.clientWidth;
        const wrapperH = cropWrapper.clientHeight;
        canvas.width = wrapperW;
        canvas.height = wrapperH;
        const scale = Math.min(wrapperW / originalImage.width, wrapperH / originalImage.height);
        const dw = originalImage.width * scale;
        const dh = originalImage.height * scale;
        const dx = (wrapperW - dw) / 2;
        const dy = (wrapperH - dh) / 2;
        ctx.clearRect(0,0,wrapperW,wrapperH);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,wrapperW,wrapperH);
        ctx.drawImage(originalImage, dx, dy, dw, dh);
    }

    // ---------- AI Background Removal ----------
    async function processImage(file) {
        statusMsg1.textContent = '⏳ Removing background with AI…';
        uploadBox.style.pointerEvents = 'none';
        try {
            const blob = await BackgroundRemoval.removeBackground(file, {
                model: 'isnet',
                output: { format: 'image/png', quality: 1 },
                progress: (key, current, total) => {
                    statusMsg1.textContent = `AI working… ${Math.round(current/total*100)}%`;
                }
            });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                URL.revokeObjectURL(url);
                setStep(2);
                drawCanvas();
                resetCrop();
                statusMsg2.textContent = 'Drag the rectangle to frame your face properly.';
                uploadBox.style.pointerEvents = 'auto';
            };
            img.src = url;
        } catch (err) {
            statusMsg1.textContent = '❌ Error: ' + err.message;
            uploadBox.style.pointerEvents = 'auto';
        }
    }

    // ---------- Generate final passport image ----------
    function generatePassport() {
        if (!originalImage) return;
        const [wMM, hMM] = sizeSelect.value.split('x').map(Number);
        const dpi = 300;
        const finalW = Math.round(wMM * dpi / 25.4);
        const finalH = Math.round(hMM * dpi / 25.4);
        const wrapperW = cropWrapper.clientWidth;
        const wrapperH = cropWrapper.clientHeight;
        const boxLeft = parseFloat(cropBox.style.left);
        const boxTop = parseFloat(cropBox.style.top);
        const boxW = parseFloat(cropBox.style.width);
        const boxH = parseFloat(cropBox.style.height);
        const scale = Math.min(wrapperW / originalImage.width, wrapperH / originalImage.height);
        const imgDrawW = originalImage.width * scale;
        const imgDrawH = originalImage.height * scale;
        const offsetX = (wrapperW - imgDrawW) / 2;
        const offsetY = (wrapperH - imgDrawH) / 2;
        const srcX = (boxLeft - offsetX) / scale;
        const srcY = (boxTop - offsetY) / scale;
        const srcW = boxW / scale;
        const srcH = boxH / scale;
        const outCanvas = document.createElement('canvas');
        outCanvas.width = finalW;
        outCanvas.height = finalH;
        const outCtx = outCanvas.getContext('2d');
        outCtx.fillStyle = '#FFFFFF';
        outCtx.fillRect(0,0,finalW,finalH);
        outCtx.drawImage(originalImage, srcX, srcY, srcW, srcH, 0, 0, finalW, finalH);
        return outCanvas.toDataURL('image/jpeg', 0.92);
    }

    // ---------- Event listeners ----------
    uploadBox.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
        if (e.target.files[0]) processImage(e.target.files[0]);
    });
    uploadBox.addEventListener('dragover', e => { e.preventDefault(); uploadBox.classList.add('dragover'); });
    uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
    uploadBox.addEventListener('drop', e => {
        e.preventDefault();
        uploadBox.classList.remove('dragover');
        if (e.dataTransfer.files[0]) processImage(e.dataTransfer.files[0]);
    });

    sizeSelect.addEventListener('change', () => {
        if (originalImage) { resetCrop(); drawCanvas(); }
    });
    resetCropBtn.addEventListener('click', () => { if(originalImage) resetCrop(); });
    redoBtn.addEventListener('click', () => {
        originalImage = null;
        setStep(1);
        statusMsg1.textContent = 'Your photo stays private – processed on device';
        uploadBox.style.pointerEvents = 'auto';
    });
    nextToDownload.addEventListener('click', () => {
        const dataUrl = generatePassport();
        resultPreview.src = dataUrl;
        resultPreview.style.display = 'block';
        setStep(3);
    });
    downloadBtn.addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = resultPreview.src;
        a.download = `passport_${sizeSelect.value.replace('x','x')}mm.jpg`;
        a.click();
    });
    newPhotoBtn.addEventListener('click', () => {
        originalImage = null;
        resultPreview.src = '';
        resultPreview.style.display = 'none';
        setStep(1);
        uploadBox.style.pointerEvents = 'auto';
        statusMsg1.textContent = 'Your photo stays private – processed on device';
    });

    window.addEventListener('resize', () => {
        if (originalImage) {
            drawCanvas();
            updateCropBox();
        }
    });
    setStep(1);
</script>
</body>
</html>
